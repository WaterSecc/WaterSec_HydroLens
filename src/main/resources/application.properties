spring.application.name=waterSec_HydroLens
spring.config.import=optional:file:.env[.properties]

# Server
# 8080 is occupied by a local XAMPP Tomcat, so HydroLens runs on 8081.
server.port=8081
hydrolens.security.public-api=${WATERSEC_PUBLIC_API:true}
spring.security.user.name=${WATERSEC_API_USERNAME:watersec}
spring.security.user.password=${WATERSEC_API_PASSWORD:change-me}
hydrolens.web.allowed-origins=${HYDROLENS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# Event-driven simulation defaults (all values can be overridden per environment).
hydrolens.simulation.guests-per-occupied-room=1.6
hydrolens.simulation.version=event-driven-1.0
hydrolens.simulation.showers-per-guest-day=0.9
hydrolens.simulation.shower-liters=55
hydrolens.simulation.flushes-per-guest-day=4.5
hydrolens.simulation.toilet-flush-liters=6
hydrolens.simulation.hand-washes-per-guest-day=5
hydrolens.simulation.hand-wash-liters=1.8
hydrolens.simulation.laundry-cycle-liters=120
hydrolens.simulation.restaurant-meal-liters=20
hydrolens.simulation.pool-guest-liters=18
hydrolens.simulation.spa-visit-liters=35
hydrolens.simulation.irrigation-liters-per-unit=5
hydrolens.simulation.leak-probability-per-day=0.08
hydrolens.simulation.leak-liters-per-hour=35
hydrolens.simulation.telemetry-interval-minutes=15
hydrolens.simulation.base-pressure-bar=3.2
hydrolens.simulation.average-temperature-c=20
hydrolens.simulation.temperature-amplitude-c=10
hydrolens.simulation.hot-weather-threshold-c=27
hydrolens.simulation.cold-weather-threshold-c=12
hydrolens.simulation.hot-weather-demand-factor=1.18
hydrolens.simulation.cold-weather-demand-factor=0.85
hydrolens.simulation.summer-demand-factor=1.10
hydrolens.simulation.winter-demand-factor=0.96

# AI integration contract. Remote inference remains opt-in through gateway-mode.
hydrolens.ai.version=${HYDROLENS_AI_VERSION:none}
hydrolens.ai.gateway-mode=${HYDROLENS_AI_GATEWAY_MODE:local-no-ml}
hydrolens.ai.contract-version=1.0
hydrolens.ai.base-url=${HF_BASE_URL:https://router.huggingface.co/v1}
hydrolens.ai.token=${HF_TOKEN:}
hydrolens.ai.model=${HF_MODEL:meta-llama/Llama-3.1-8B-Instruct:nscale}
hydrolens.ai.connect-timeout-seconds=5
hydrolens.ai.read-timeout-seconds=30

# Temporary Digital Twin sessions. All hotel, network, baseline, and event state
# is held in application memory and is deliberately lost when the backend restarts.
hydrolens.digital-twin-session.ttl=${HYDROLENS_SESSION_TTL:PT60M}
hydrolens.digital-twin-session.cleanup-interval=${HYDROLENS_SESSION_CLEANUP_INTERVAL:PT5M}
hydrolens.digital-twin-session.max-sessions=${HYDROLENS_MAX_SESSIONS:100}
